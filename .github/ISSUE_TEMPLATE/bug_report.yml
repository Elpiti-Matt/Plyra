name: Bug report
description: Report a reproducible problem without private graph data
body:
  - type: input
    id: version
    attributes:
      label: Plyra version, browser and device
      placeholder: v0.7.0-rc.4, Safari, iPhone
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Use the coffee demo or a minimal synthetic graph. Do not attach private documents.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: View, viewport size and screenshot
      description: Include Sheets (single sheet or overview), Spread, Stack, Contents or All-to-1 and whether the file was opened locally or hosted.
