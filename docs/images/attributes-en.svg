<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Plyra attributes</title><desc id="desc">A numeric attribute definition is shared by two appearances of one node. Six data types are supported.</desc><rect width="1200" height="720" fill="#f7f4fb"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="45" font-size="28" fill="#352544" font-weight="700">Plyra · Shared typed attributes</text><text x="36" y="78" font-size="17" fill="#7e718c" font-weight="400">Illustrated data flow · one definition, one value for each entity</text><rect x="36" y="116" width="346" height="316" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="57" y="155" font-size="23" fill="#352544" font-weight="700">1 · Define an attribute</text><text x="57" y="191" font-size="18" fill="#79579a" font-weight="400">Types → Attributes</text><text x="57" y="242" font-size="19" fill="#352544" font-weight="400">Name: Cost, ₽</text><text x="57" y="276" font-size="19" fill="#352544" font-weight="400">Data type: Number</text><text x="57" y="322" font-size="17" fill="#7e718c" font-weight="400">ID: cost</text><text x="57" y="367" font-size="17" fill="#79579a" font-weight="400">types.attributes</text><text x="57" y="401" font-size="15" fill="#7e718c" font-weight="400">Available to every node</text><path d="M405 264 L454 264" fill="none" stroke="#79579a" stroke-width="3"/><text x="414" y="252" font-size="23" fill="#352544" font-weight="400">→</text><rect x="478" y="116" width="316" height="316" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="496" y="153" font-size="22" fill="#352544" font-weight="700">Product</text><rect x="496" y="179" width="280" height="217" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="511" y="213" font-size="19" fill="#352544" font-weight="600">Morning blend</text><text x="736" y="212" font-size="23" fill="#79579a" font-weight="400">−</text><text x="511" y="250" font-size="15" fill="#7e718c" font-weight="400">ID: blend</text><text x="511" y="284" font-size="17" fill="#352544" font-weight="400">Recipe draft…</text><rect x="511" y="309" width="248" height="58" rx="14" fill="#f7f4fb" stroke="#d9d1e3" stroke-width="2"/><text x="524" y="345" font-size="19" fill="#352544" font-weight="400">Cost, ₽: 125</text><rect x="848" y="116" width="316" height="316" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="866" y="153" font-size="22" fill="#352544" font-weight="700">Money</text><rect x="866" y="179" width="280" height="217" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="881" y="213" font-size="19" fill="#352544" font-weight="600">Morning blend</text><text x="1106" y="212" font-size="23" fill="#79579a" font-weight="400">−</text><text x="881" y="250" font-size="15" fill="#7e718c" font-weight="400">ID: blend</text><text x="881" y="284" font-size="17" fill="#352544" font-weight="400">Recipe draft…</text><rect x="881" y="309" width="248" height="58" rx="14" fill="#f7f4fb" stroke="#d9d1e3" stroke-width="2"/><text x="894" y="345" font-size="19" fill="#352544" font-weight="400">Cost, ₽: 125</text><path d="M778 236 L866 236" fill="none" stroke="#b78425" stroke-width="3"/><text x="478" y="461" font-size="19" fill="#352544" font-weight="600">One node ID → the same values on every sheet</text><rect x="36" y="491" width="1128" height="175" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="57" y="529" font-size="21" fill="#352544" font-weight="700">Supported data types</text><text x="57" y="568" font-size="20" fill="#352544" font-weight="400">Text · Number · Boolean · Date · URL · Single choice</text><text x="57" y="610" font-size="17" fill="#79579a" font-weight="400">node.attributes: {&quot;cost&quot;: 125} · null = attached but unset</text><text x="57" y="644" font-size="16" fill="#7e718c" font-weight="400">Illustrative values. Expand a node with + to edit its text and attributes.</text></g></svg>