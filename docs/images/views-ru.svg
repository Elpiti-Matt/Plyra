<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Plyra views</title><desc id="desc">Two-level sheet navigation and separate Spread, Stack and All-to-1 modes.</desc><rect width="1200" height="720" fill="#f7f4fb"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="36" y="45" font-size="28" fill="#352544" font-weight="700">Plyra · Лист и обзор всех листов</text><text x="36" y="78" font-size="16" fill="#7e718c" font-weight="400">Учебная схема · показывает поведение, а не точную раскладку интерфейса</text><rect x="36" y="110" width="400" height="320" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="58" y="148" font-size="22" fill="#352544" font-weight="700">1 · Редактировать лист</text><rect x="350" y="164" width="62" height="34" rx="14" fill="#eee5f7" stroke="#d9d1e3" stroke-width="2"/><text x="374" y="189" font-size="24" fill="#352544" font-weight="400">−</text><text x="58" y="198" font-size="17" fill="#7e718c" font-weight="400">Продукт</text><path d="M229 265 L255 350" fill="none" stroke="#64748b" stroke-width="3"/><rect x="65" y="223" width="240" height="66" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="82" y="250" font-size="19" fill="#352544" font-weight="600">Общий узел</text><text x="82" y="276" font-size="15" fill="#7e718c" font-weight="400">ID: blend</text><text x="280" y="246" font-size="21" fill="#352544" font-weight="400">+</text><rect x="215" y="325" width="190" height="65" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="232" y="360" font-size="19" fill="#352544" font-weight="400">Процесс</text><text x="58" y="410" font-size="16" fill="#7e718c" font-weight="400">Узлы, текст и атрибуты</text><path d="M459 242 L515 242" fill="none" stroke="#79579a" stroke-width="3"/><text x="466" y="222" font-size="22" fill="#352544" font-weight="400">−</text><path d="M459 329 L515 329" fill="none" stroke="#79579a" stroke-width="3"/><text x="466" y="312" font-size="22" fill="#352544" font-weight="400">+</text><rect x="540" y="110" width="624" height="320" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="562" y="147" font-size="22" fill="#352544" font-weight="700">2 · Обзор всех листов</text><text x="562" y="179" font-size="17" fill="#79579a" font-weight="400">Связи выделенного листа: Продукт</text><rect x="562" y="206" width="265" height="88" rx="14" fill="#fff" stroke="#79579a" stroke-width="2"/><rect x="562" y="206" width="265" height="28" rx="7" fill="#eee8f5" stroke="#d9d1e3" stroke-width="2"/><text x="572" y="226" font-size="15" fill="#352544" font-weight="600">Продукт</text><text x="802" y="227" font-size="20" fill="#352544" font-weight="400">+</text><text x="580" y="267" font-size="16" fill="#9a6129" font-weight="400">blend</text><rect x="872" y="206" width="265" height="88" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><rect x="872" y="206" width="265" height="28" rx="7" fill="#eee8f5" stroke="#d9d1e3" stroke-width="2"/><text x="882" y="226" font-size="15" fill="#352544" font-weight="600">Деньги</text><text x="1112" y="227" font-size="20" fill="#352544" font-weight="400">+</text><text x="890" y="267" font-size="16" fill="#9a6129" font-weight="400">blend</text><rect x="872" y="305" width="265" height="88" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><rect x="872" y="305" width="265" height="28" rx="7" fill="#eee8f5" stroke="#d9d1e3" stroke-width="2"/><text x="882" y="325" font-size="15" fill="#352544" font-weight="600">Проверки</text><text x="1112" y="326" font-size="20" fill="#352544" font-weight="400">+</text><text x="890" y="366" font-size="16" fill="#9a6129" font-weight="400">blend</text><path d="M659 260 L881 260" fill="none" stroke="#b78425" stroke-width="3"/><path d="M659 265 L881 358" fill="none" stroke="#b78425" stroke-width="3"/><text x="561" y="418" font-size="16" fill="#7e718c" font-weight="400">Листы — за заголовки · обзор — за фон</text><text x="36" y="474" font-size="23" fill="#352544" font-weight="700">Другие режимы решают отдельные задачи</text><rect x="36" y="494" width="354" height="127" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="54" y="528" font-size="21" fill="#352544" font-weight="700">Разворот</text><text x="54" y="562" font-size="16" fill="#352544" font-weight="400">Сравнить 2–6 листов</text><text x="54" y="591" font-size="16" fill="#7e718c" font-weight="400">Рядом, в заданных пропорциях</text><rect x="423" y="494" width="354" height="127" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="441" y="528" font-size="21" fill="#352544" font-weight="700">Стопка</text><text x="441" y="562" font-size="16" fill="#352544" font-weight="400">Построчно / Узлы и связи</text><text x="441" y="591" font-size="16" fill="#7e718c" font-weight="400">Группировка по типу или тегу</text><rect x="810" y="494" width="354" height="127" rx="14" fill="#fff" stroke="#d9d1e3" stroke-width="2"/><text x="828" y="528" font-size="21" fill="#352544" font-weight="700">Все на один лист</text><text x="828" y="562" font-size="16" fill="#352544" font-weight="400">Каждая сущность один раз</text><text x="828" y="591" font-size="16" fill="#7e718c" font-weight="400">Отдельная расстановка</text><text x="36" y="669" font-size="18" fill="#352544" font-weight="400">Золото: один ID · пунктир: связь между листами · сплошная: внутри листа</text></g></svg>